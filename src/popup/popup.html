<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>全銀コード検索</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>全銀コード検索</h1>

      <section aria-labelledby="bank-search-heading">
        <h2 id="bank-search-heading">1. 銀行を検索</h2>
        <form id="bank-search-form">
          <label for="bank-query">銀行名または銀行コード(4桁)</label>
          <input
            id="bank-query"
            name="bank-query"
            type="text"
            autocomplete="off"
            placeholder="例: みずほ / 0001"
          />
          <button type="submit">検索</button>
        </form>
        <p id="bank-status" class="status" role="status" aria-live="polite"></p>
        <ul id="bank-results" class="result-list" aria-label="銀行の検索結果"></ul>
      </section>

      <section id="branch-section" aria-labelledby="branch-search-heading" hidden>
        <h2 id="branch-search-heading">2. 支店を検索</h2>
        <p id="selected-bank" class="selected-bank" aria-live="polite"></p>
        <form id="branch-search-form">
          <label for="branch-query">支店名または支店コード(3桁)</label>
          <input
            id="branch-query"
            name="branch-query"
            type="text"
            autocomplete="off"
            placeholder="例: 東京 / 001"
          />
          <button type="submit">検索</button>
        </form>
        <p id="branch-status" class="status" role="status" aria-live="polite"></p>
        <ul id="branch-results" class="result-list" aria-label="支店の検索結果"></ul>
      </section>

      <section id="detail-section" aria-labelledby="detail-heading" hidden>
        <h2 id="detail-heading">選択した支店の情報</h2>
        <dl id="detail-list" class="detail-list"></dl>
      </section>

      <p id="copy-feedback" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
